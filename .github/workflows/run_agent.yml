name: Run Official Flop Stealth Agent
on:
  schedule:
    - cron: '15 2,7,13,19,22 * * *'
  workflow_dispatch:

jobs:
  start-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Network Dependencies
        run: |
          if [ -f package.json ]; then
            npm install
          fi

      - name: Execute Stealth Core Cycle
        run: node index.js
        env:
          MY_SECRET_SEED: ${{ secrets.MY_SECRET_SEED }}
